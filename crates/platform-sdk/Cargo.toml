[package]
name = "platform-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared platform contract for the multi-game launcher: game and mod manifests, the launcher-game interface, signed platform tokens. No dependency on any game crate (it moves to its own repository)."

# Keep this crate free of roses-* dependencies: it is the future
# `platform-sdk` repository that the launcher, the account service and every
# game depend on by version (see work/research/platform/PLATFORM-PLAN.md).
[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Ed25519 signatures for platform tokens (already in the tree through rustls).
ring = "0.17"
