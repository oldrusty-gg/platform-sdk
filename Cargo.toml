[workspace]
members = ["crates/platform-sdk", "crates/platform-net", "crates/platform-video"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.18"


# The video recorder scales and converts 1080p frames every frame.
[profile.dev.package.platform-video]
opt-level = 3
